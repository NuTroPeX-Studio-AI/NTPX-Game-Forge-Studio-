[workspace]
members = [
  "crates/gameforge-core",
  "crates/gamespec",
  "crates/gamespec-compiler",
  "crates/autonomy-governor",
  "crates/model-router",
  "crates/agent-orchestrator",
  "crates/agent-orchestrator-evidence",
  "crates/agent-orchestrator-router",
  "crates/agent-orchestrator-governance",
  "crates/agent-orchestrator-escalation",
  "crates/roadmap-contract",
  "crates/code-intelligence",
  "crates/agent-zero-execution",
  "crates/unreal-engine-bridge",
  "crates/build-test-repair",
  "crates/hermes-memory-skills",
  "crates/openclaw-remote-gateway",
  "crates/project-world-model",
  "crates/evaluation-council",
  "crates/asset-production",
  "crates/narrative-audio-npc",
  "crates/controlled-self-improvement",
  "crates/signal-born-slice",
  "crates/release-pipeline",
]
exclude = [
  "apps/studio-desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["NuTroPeX"]
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
hmac = "0.12.1"
fs2 = "0.4.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
